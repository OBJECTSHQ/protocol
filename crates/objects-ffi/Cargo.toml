[package]
name = "objects-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings for OBJECTS Protocol — Kotlin and Swift SDK"

[lib]
crate-type = ["lib", "cdylib"]
name = "objects_ffi"

[dependencies]
objects-core.workspace = true
objects-transport.workspace = true

# FFI
uniffi = { version = "0.29", features = ["cli"] }

# Async
tokio.workspace = true

# Networking (for connecting to existing node)
irpc-iroh.workspace = true

# Serialization
bytes.workspace = true
serde_json.workspace = true

# File locking
fs4.workspace = true

# Error handling
thiserror.workspace = true
tracing.workspace = true
